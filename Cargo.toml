[package]
name = "ebachat-server"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Chat server in Rust, compatible with the Mattermost database schema"
publish = false

[dependencies]
ab_glyph = "0.2.32"
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
bytes = "1.12.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
comrak = { version = "1.1.0", default-features = false }
ebachat-macros = { version = "0.1.0", path = "macros" }
encoding_rs = "0.8.44"
flate2 = "1.1.11"
futures-util = "0.3.34"
goplugin = { path = "goplugin" }
hmac = "0.13.0"
html-escape = "0.3.1"
html5ever = "0.27"
http = "1.5.0"
httpdate = "1.0.3"
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
jpeg-encoder = "0.7.1"
libc = "0.2.191"
lru = "0.19.0"
markup5ever_rcdom = "0.3"
mime_guess = "2.0.5"
multer = "3.1.0"
object_store = { version = "0.14.2", features = ["aws"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
pbkdf2 = "0.13.0"
qrcode = { version = "0.14", default-features = false }
quick-xml = "0.38"
rand = "0.10.4"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rustls-platform-verifier = "0.7"
rsa = { version = "0.10.0", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "json", "macros"] }
tar = { version = "0.4", default-features = false }
tokio = { version = "1.54.1", features = ["full"] }
unicode-normalization = "0.1.26"
tokio-rustls = "0.26"
tower = { version = "0.5.3", features = ["util"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = { version = "0.13.3", default-features = false }

[workspace]
members = ["macros", "goplugin", "tools/loadgen"]

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
